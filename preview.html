<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>DevEmu Preview</title>
    <script>
      // 浏览器预览专用：stub 掉 Electron preload 暴露的 window.devemu
      window.devemu = new Proxy(
        {},
        {
          get(_t, prop) {
            if (prop === 'envStatus') {
              return () =>
                Promise.resolve({
                  ok: true,
                  data: {
                    settings: {
                      dataRoot: 'C:\\DevEmu',
                      sdkPath: 'C:\\Users\\GNiTi\\AppData\\Local\\Android\\Sdk',
                      javaPath: 'C:\\Users\\GNiTi\\.jdks\\openjdk-23.0.1\\bin\\java.exe',
                      gpuMode: 'swiftshader_indirect',
                      proxyEnabled: false,
                      proxyPort: 7890,
                      maxDownloadKbps: 0,
                      parallelDownloads: 2,
                      androidDownloadRoute: 'direct',
                      harmonyDownloadRoute: 'direct',
                    },
                    sdk: { root: 'C:\\Users\\GNiTi\\AppData\\Local\\Android\\Sdk' },
                    java: 'C:\\Users\\GNiTi\\.jdks\\openjdk-23.0.1\\bin\\java.exe',
                    harmony: null,
                    version: '0.1.0',
                    images: [],
                  },
                });
            }
            if (prop === 'openDirDialog') return () => Promise.resolve({ ok: true, data: 'D:\\sdk-test' });
            if (prop === 'envCheckDir') return () => Promise.resolve({ ok: true, data: { found: false } });
            if (prop === 'envInstall') return () => Promise.resolve({ ok: true, data: { manual: false, label: 'HarmonyOS SDK' } });
            if (['onSdkProgress', 'onDownloadsChanged', 'onWinMaximized', 'onAutoInstall', 'onEnvChanged', 'onEnvInstallResult'].includes(prop)) {
              return () => () => undefined;
            }
            return () => Promise.resolve({ ok: true, data: [] });
          },
        },
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/index.tsx"></script>
  </body>
</html>
